<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karte 01</title>
<style>
  :root {
    --bg: #111; --fg: #eee; --dim: #aab; --panel: rgba(16,18,24,.88); --rand: #3a3f4c;
    --sperr: #e63a3a; --frei: #3ec46d; --deckt: #3a7bff; --akzent: #ffd23f;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; outline: none; }
  [hidden] { display: none !important; }
  canvas.editor { cursor: crosshair; }
  #info {
    position: fixed; left: calc(8px + env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px));
    padding: 4px 8px; background: var(--panel); border-radius: 4px; pointer-events: none; white-space: pre;
  }
  #editor {
    position: fixed; right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: min(300px, calc(100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
    box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    background: var(--panel); border: 1px solid var(--rand); border-radius: 6px;
  }
  #editor h2 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--akzent); }
  .reihe { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--fg); background: #232733; border: 1px solid var(--rand); border-radius: 4px;
    padding: 5px 8px; cursor: pointer;
  }
  button:hover { background: #2d3240; }
  button:focus-visible { outline: 2px solid var(--akzent); outline-offset: 1px; }
  button.pinsel { display: flex; align-items: center; gap: 6px; flex: 1 1 0; justify-content: center; min-width: 0; }
  button.pinsel[aria-pressed="true"] { border-color: var(--akzent); background: #353a2a; }
  .farbe { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  #ausgabe {
    width: 100%; box-sizing: border-box; height: 72px; resize: vertical; font: 11px/1.3 inherit;
    font-family: inherit; color: var(--fg); background: #0b0c10; border: 1px solid var(--rand); border-radius: 4px; padding: 4px;
  }
  #status { color: var(--dim); min-height: 1.4em; }
  .tabs { display: flex; gap: 0; border: 1px solid var(--rand); border-radius: 4px; overflow: hidden; }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; }
  .tabs button[aria-selected="true"] { background: #353a2a; color: var(--akzent); }
  #editorKnopf {
    position: fixed; right: calc(8px + env(safe-area-inset-right, 0px)); top: calc(8px + env(safe-area-inset-top, 0px));
  }
</style>
</head>
<body>
<canvas id="spiel"></canvas>
<div id="info">Lade Karte …</div>
<button id="editorKnopf" type="button">Editor (E)</button>

<div id="editor" hidden>
  <h2>Editor</h2>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabKollision" aria-selected="true">Kollision (Tab)</button>
    <button type="button" role="tab" id="tabEbenen" aria-selected="false">Ebenen (Tab)</button>
  </div>
  <div class="reihe" role="group" aria-label="Pinsel Kollision" id="pinselKollision">
    <button type="button" class="pinsel" data-wert="1"><span class="farbe" style="background:var(--frei)"></span>Frei <small>1</small></button>
    <button type="button" class="pinsel" data-wert="2"><span class="farbe" style="background:var(--sperr)"></span>Gesperrt <small>2</small></button>
    <button type="button" class="pinsel" data-wert="3"><span class="farbe" style="background:var(--deckt)"></span>Verdeckt <small>3</small></button>
  </div>
  <div class="reihe" role="group" aria-label="Pinsel Ebenen" id="pinselEbenen" hidden>
    <button type="button" class="pinsel" data-wert="hinten">Hinter Spieler <small>1</small></button>
    <button type="button" class="pinsel" data-wert="geteilt">Geteilt <small>2</small></button>
    <button type="button" class="pinsel" data-wert="vorne">Vor Spieler <small>3</small></button>
  </div>
  <div id="status"></div>
  <textarea id="ausgabe" readonly spellcheck="false" aria-label="Änderungen als Text"></textarea>
  <div class="reihe">
    <button type="button" id="kopieren">Änderungen kopieren</button>
    <button type="button" id="rueckgaengig">Rückgängig</button>
    <button type="button" id="verwerfen">Alle verwerfen</button>
  </div>
</div>

<script src="karte01_kollision.js"></script>
<script src="karte01_objekte.js"></script>
<script>
(() => {
  'use strict';

  const EBENEN = '../maps/karte01/ebenen/';
  const K = window.KARTE01_KOLLISION;
  const TILE = K.tile_size;               // 16
  const COLS = K.cols, ROWS = K.rows;     // 110 x 120
  const MAP_W = COLS * TILE, MAP_H = ROWS * TILE;
  const SPEICHER = 'karte01_kollision_aenderungen';
  const SPEICHER_EBENEN = 'karte01_ebenen_aenderungen';

  // ---- Objekte (einzeln gezeichnet, damit ihre Ebene umschaltbar ist) --
  const O = window.KARTE01_OBJEKTE;
  const SPRITES = O.sprites.map(sp => {
    const bin = atob(sp.maske), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return Object.assign({}, sp, { bits: bytes });
  });
  const objekte = O.objekte.map(([key, si, x, y, trenn, standard, modus]) => {
    const sp = SPRITES[si];
    return { key, sp, x, y, trenn: Math.min(trenn, sp.h), standard, basisModus: modus, modus };
  });
  const objektNach = new Map(objekte.map(o => [o.key, o]));
  const ebenenAenderungen = new Map();    // key -> modus (abweichend vom geladenen Stand)
  function setzeModus(o, m) {
    o.modus = m;
    if (o.basisModus === m) ebenenAenderungen.delete(o.key); else ebenenAenderungen.set(o.key, m);
  }
  // Pixel des Objekts an Kartenposition (mx,my)? Liefert 'oben' / 'unten' / null
  function objektTreffer(o, mx, my) {
    const lx = Math.floor(mx - o.x), ly = Math.floor(my - o.y), sp = o.sp;
    if (lx < 0 || ly < 0 || lx >= sp.w || ly >= sp.h) return null;
    const i = ly * sp.w + lx;
    if (!((sp.bits[i >> 3] >> (7 - (i & 7))) & 1)) return null;
    if (o.modus === 'vorne' || (o.modus === 'geteilt' && ly < o.trenn)) return 'oben';
    return 'unten';
  }
  function objektUnter(mx, my) {
    let unten = null;
    for (let i = objekte.length - 1; i >= 0; i--) {
      const t = objektTreffer(objekte[i], mx, my);
      if (t === 'oben') return objekte[i];
      if (t === 'unten' && !unten) unten = objekte[i];
    }
    return unten;
  }

  const SPIELER_GROESSE = 16;             // 16x16 grauer Pixel
  const TEMPO = 80;                       // Kartenpixel pro Sekunde
  const START = { x: 54 * TILE, y: 53 * TILE };

  const $ = id => document.getElementById(id);
  const canvas = $('spiel');
  const ctx = canvas.getContext('2d');
  const info = $('info');

  // ---- Raster: Original + Aenderungen ----------------------------------
  const basis = K.raster.map(z => z.split(''));
  const raster = basis.map(z => z.slice());
  const aenderungen = new Map();          // "x,y" -> '1' | '2' | '3'

  function kachel(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return '2';
    return raster[ty][tx];
  }
  function setzeKachel(tx, ty, w) {
    raster[ty][tx] = w;
    const key = tx + ',' + ty;
    if (basis[ty][tx] === w) aenderungen.delete(key); else aenderungen.set(key, w);
  }

  try {
    const gespeichert = JSON.parse(localStorage.getItem(SPEICHER) || '[]');
    for (const [x, y, w] of gespeichert)
      if (x >= 0 && y >= 0 && x < COLS && y < ROWS && '123'.includes(w)) setzeKachel(x, y, String(w));
  } catch (e) { /* kein Speicher verfuegbar */ }
  try {
    const gespeichert = JSON.parse(localStorage.getItem(SPEICHER_EBENEN) || '[]');
    for (const [key, m] of gespeichert) {
      const o = objektNach.get(key);
      if (o && ['hinten', 'geteilt', 'vorne'].includes(m)) setzeModus(o, m);
    }
  } catch (e) { /* kein Speicher verfuegbar */ }

  function speichern() {
    try {
      const liste = [...aenderungen].map(([k, w]) => { const [x, y] = k.split(',').map(Number); return [x, y, w]; });
      localStorage.setItem(SPEICHER, JSON.stringify(liste));
      localStorage.setItem(SPEICHER_EBENEN, JSON.stringify([...ebenenAenderungen]));
    } catch (e) { /* egal */ }
  }

  // ---- Kollision -------------------------------------------------------
  function kollidiert(x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 1) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 1) / TILE);
    for (let ty = y0; ty <= y1; ty++)
      for (let tx = x0; tx <= x1; tx++)
        if (kachel(tx, ty) === '2') return true;
    return false;
  }

  // ---- Spieler ---------------------------------------------------------
  const spieler = { x: START.x, y: START.y, rx: 0, ry: 0 };

  function bewege(dx, dy) {
    spieler.rx += dx; spieler.ry += dy;
    let sx = Math.trunc(spieler.rx), sy = Math.trunc(spieler.ry);
    spieler.rx -= sx; spieler.ry -= sy;
    const s = SPIELER_GROESSE;
    // Steht man schon in einer gesperrten Kachel (z. B. gerade hineingemalt), darf man frei heraus.
    const frei = kollidiert(spieler.x, spieler.y, s, s);
    while (sx !== 0) {
      const st = Math.sign(sx);
      if (!frei && kollidiert(spieler.x + st, spieler.y, s, s)) { spieler.rx = 0; break; }
      spieler.x = Math.max(0, Math.min(MAP_W - s, spieler.x + st)); sx -= st;
    }
    while (sy !== 0) {
      const st = Math.sign(sy);
      if (!frei && kollidiert(spieler.x, spieler.y + st, s, s)) { spieler.ry = 0; break; }
      spieler.y = Math.max(0, Math.min(MAP_H - s, spieler.y + st)); sy -= st;
    }
  }

  // ---- Darstellung / Kamera --------------------------------------------
  let zoom = 3;
  let kamera = { camX: 0, camY: 0, skala: 1 };
  function groesse() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
  }
  addEventListener('resize', groesse);
  groesse();

  function bildschirmZuKachel(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const mx = ((cx - r.left) * dpr) / kamera.skala + kamera.camX;
    const my = ((cy - r.top) * dpr) / kamera.skala + kamera.camY;
    return { tx: Math.floor(mx / TILE), ty: Math.floor(my / TILE), mx, my };
  }

  // ---- Editor ----------------------------------------------------------
  let editor = false;
  let zeigeKollision = false;
  let modusTab = 'kollision';             // 'kollision' | 'ebenen'
  let pinsel = '2';
  let ebenenPinsel = 'vorne';
  let maus = null;                        // Kachel unter dem Mauszeiger
  let mausObjekt = null;                  // Objekt unter dem Mauszeiger (Ebenen-Modus)
  const verlauf = [];                     // Striche fuer Rueckgaengig
  let strich = null;

  function pinselAnzeigen() {
    for (const b of document.querySelectorAll('#pinselKollision .pinsel')) b.setAttribute('aria-pressed', String(b.dataset.wert === pinsel));
    for (const b of document.querySelectorAll('#pinselEbenen .pinsel')) b.setAttribute('aria-pressed', String(b.dataset.wert === ebenenPinsel));
  }
  function setzePinsel(w) {
    if (['1', '2', '3'].includes(w)) pinsel = w; else ebenenPinsel = w;
    pinselAnzeigen();
  }
  pinselAnzeigen();
  function setzeTab(t) {
    modusTab = t;
    $('tabKollision').setAttribute('aria-selected', String(t === 'kollision'));
    $('tabEbenen').setAttribute('aria-selected', String(t === 'ebenen'));
    $('pinselKollision').hidden = t !== 'kollision';
    $('pinselEbenen').hidden = t !== 'ebenen';
    editorAktualisieren();
  }

  function anzahl() { return aenderungen.size + ebenenAenderungen.size; }
  function textAusgabe() {
    const liste = [...aenderungen].map(([k, w]) => { const [x, y] = k.split(',').map(Number); return [x, y, w]; })
      .sort((a, b) => a[1] - b[1] || a[0] - b[0]);
    const zeilen = ['karte01 editor'];
    if (liste.length) zeilen.push('# kollision (x,y=wert  1 frei, 2 gesperrt, 3 verdeckt)',
      ...liste.map(([x, y, w]) => x + ',' + y + '=' + w));
    if (ebenenAenderungen.size) zeilen.push('# ebenen (objekt=hinten|geteilt|vorne)',
      ...[...ebenenAenderungen].sort().map(([k, m]) => k + '=' + m));
    return zeilen.join('\n');
  }
  function editorAktualisieren(meldung) {
    $('ausgabe').value = anzahl() ? textAusgabe() : '';
    const teile = [];
    if (aenderungen.size) teile.push(aenderungen.size + (aenderungen.size === 1 ? ' Kachel' : ' Kacheln'));
    if (ebenenAenderungen.size) teile.push(ebenenAenderungen.size + (ebenenAenderungen.size === 1 ? ' Objekt' : ' Objekte'));
    $('status').textContent = meldung || (teile.length ? teile.join(', ') + ' geändert'
      : modusTab === 'kollision' ? 'Noch nichts geändert. Auf Kacheln klicken oder ziehen.'
      : 'Noch nichts geändert. Pinsel wählen und Objekte anklicken.');
  }

  function editorUmschalten(an) {
    editor = an;
    $('editor').hidden = !an;
    canvas.classList.toggle('editor', an);
    $('editorKnopf').textContent = an ? 'Editor schließen (E)' : 'Editor (E)';
    if (an) editorAktualisieren();
    canvas.focus();
  }

  // Ebenen-Pinsel: Objekt unter dem Zeiger bekommt den gewaehlten Modus
  function maleObjekt(mx, my) {
    const o = objektUnter(mx, my);
    if (!o || o.modus === ebenenPinsel) return;
    const key = 'o:' + o.key;
    if (strich && !strich.has(key)) strich.set(key, o.modus);
    setzeModus(o, ebenenPinsel);
  }
  function male(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    const vorher = raster[ty][tx];
    if (vorher === pinsel) return;
    const key = tx + ',' + ty;
    if (strich && !strich.has(key)) strich.set(key, vorher);
    setzeKachel(tx, ty, pinsel);
  }
  // Linie zwischen zwei Kacheln, damit schnelles Ziehen keine Luecken laesst
  function maleLinie(a, b) {
    const n = Math.max(Math.abs(b.tx - a.tx), Math.abs(b.ty - a.ty), 1);
    for (let i = 0; i <= n; i++)
      male(Math.round(a.tx + (b.tx - a.tx) * i / n), Math.round(a.ty + (b.ty - a.ty) * i / n));
  }
  function strichEnde() {
    if (strich && strich.size) { verlauf.push(strich); speichern(); }
    strich = null;
    editorAktualisieren();
  }
  function rueckgaengig() {
    const s = verlauf.pop();
    if (!s) { editorAktualisieren('Nichts zum Rückgängigmachen.'); return; }
    for (const [key, w] of s) {
      if (key.startsWith('o:')) { setzeModus(objektNach.get(key.slice(2)), w); continue; }
      const [x, y] = key.split(',').map(Number); setzeKachel(x, y, w);
    }
    speichern();
    editorAktualisieren();
  }

  $('editorKnopf').addEventListener('click', () => editorUmschalten(!editor));
  for (const b of document.querySelectorAll('.pinsel')) b.addEventListener('click', () => { setzePinsel(b.dataset.wert); canvas.focus(); });
  $('tabKollision').addEventListener('click', () => { setzeTab('kollision'); canvas.focus(); });
  $('tabEbenen').addEventListener('click', () => { setzeTab('ebenen'); canvas.focus(); });
  $('rueckgaengig').addEventListener('click', rueckgaengig);
  $('verwerfen').addEventListener('click', () => {
    const b = $('verwerfen');
    if (!anzahl()) return;
    if (b.dataset.sicher !== 'ja') {
      b.dataset.sicher = 'ja'; b.textContent = 'Wirklich verwerfen?';
      setTimeout(() => { b.dataset.sicher = ''; b.textContent = 'Alle verwerfen'; }, 3000);
      return;
    }
    b.dataset.sicher = ''; b.textContent = 'Alle verwerfen';
    const s = new Map();
    for (const [key] of aenderungen) { const [x, y] = key.split(',').map(Number); s.set(key, raster[y][x]); }
    for (const [key] of s) { const [x, y] = key.split(',').map(Number); setzeKachel(x, y, basis[y][x]); }
    for (const [key] of ebenenAenderungen) s.set('o:' + key, objektNach.get(key).modus);
    for (const o of objekte) if (o.modus !== o.basisModus) setzeModus(o, o.basisModus);
    verlauf.push(s);
    speichern();
    editorAktualisieren('Alle Änderungen verworfen. Rückgängig holt sie zurück.');
  });
  $('kopieren').addEventListener('click', () => {
    if (!anzahl()) { editorAktualisieren('Es gibt noch keine Änderungen zum Kopieren.'); return; }
    const text = textAusgabe();
    const auswaehlen = () => { const t = $('ausgabe'); t.focus(); t.select(); };
    try {
      navigator.clipboard.writeText(text).then(
        () => editorAktualisieren('Kopiert. Füge den Text im Chat ein.'),
        () => { auswaehlen(); editorAktualisieren('Text ist markiert: mit Strg+C / Teilen kopieren.'); });
    } catch (e) { auswaehlen(); editorAktualisieren('Text ist markiert: mit Strg+C / Teilen kopieren.'); }
  });

  // ---- Eingabe ---------------------------------------------------------
  const tasten = new Set();
  const KEYMAP = {
    ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r',
    ArrowUp: 'o', KeyW: 'o', ArrowDown: 'u', KeyS: 'u',
  };
  canvas.tabIndex = 0;
  canvas.focus();
  addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { if (editor) { rueckgaengig(); e.preventDefault(); } return; }
    if (KEYMAP[e.code]) { tasten.add(KEYMAP[e.code]); e.preventDefault(); }
    if (e.code === 'KeyE') editorUmschalten(!editor);
    if (e.code === 'KeyK') zeigeKollision = !zeigeKollision;
    const ziffer = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
    if (editor && ziffer !== undefined)
      setzePinsel(modusTab === 'kollision' ? ['1', '2', '3'][ziffer] : ['hinten', 'geteilt', 'vorne'][ziffer]);
    if (editor && e.code === 'Tab') { setzeTab(modusTab === 'kollision' ? 'ebenen' : 'kollision'); e.preventDefault(); }
    if (e.code === 'Equal' || e.code === 'NumpadAdd' || e.key === '+') zoom = Math.min(8, zoom + 1);
    if (e.code === 'Minus' || e.code === 'NumpadSubtract' || e.key === '-') zoom = Math.max(1, zoom - 1);
  });
  addEventListener('keyup', e => { if (KEYMAP[e.code]) tasten.delete(KEYMAP[e.code]); });
  addEventListener('blur', () => { tasten.clear(); touchZiel = null; });

  // Zeiger: im Editor malen, sonst (Touch) in Fingerrichtung laufen
  let touchZiel = null;
  let letzteMalKachel = null;
  canvas.addEventListener('pointerdown', e => {
    canvas.focus();
    if (editor) {
      canvas.setPointerCapture(e.pointerId);
      strich = new Map();
      const k = bildschirmZuKachel(e.clientX, e.clientY);
      if (modusTab === 'kollision') male(k.tx, k.ty); else maleObjekt(k.mx, k.my);
      letzteMalKachel = k;
    } else if (e.pointerType !== 'mouse') {
      touchZiel = { x: e.clientX, y: e.clientY };
    }
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    const k = bildschirmZuKachel(e.clientX, e.clientY);
    maus = k;
    if (editor && strich) {
      if (modusTab === 'kollision') maleLinie(letzteMalKachel, k); else maleObjekt(k.mx, k.my);
      letzteMalKachel = k;
    }
    else if (touchZiel) touchZiel = { x: e.clientX, y: e.clientY };
  });
  const loslassen = () => { if (strich) strichEnde(); touchZiel = null; };
  canvas.addEventListener('pointerup', loslassen);
  canvas.addEventListener('pointercancel', loslassen);
  canvas.addEventListener('pointerleave', () => { maus = null; });

  // ---- Bilder ----------------------------------------------------------
  function lade(name) {
    return new Promise((ok, fehler) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => fehler(new Error('Konnte ' + name + ' nicht laden'));
      img.src = EBENEN + name;
    });
  }

  const FARBE = { '2': 'rgba(230,58,58,.45)', '3': 'rgba(58,123,255,.40)' };

  function zeichneObjekte(atlas, oben, x0, y0, x1, y1) {
    for (const o of objekte) {
      const sp = o.sp;
      if (o.x > x1 || o.y > y1 || o.x + sp.w < x0 || o.y + sp.h < y0) continue;
      let von = 0, bis = sp.h;                  // Zeilenbereich fuer diesen Durchgang
      if (o.modus === 'hinten') { if (oben) continue; }
      else if (o.modus === 'vorne') { if (!oben) continue; }
      else if (oben) bis = o.trenn; else von = o.trenn;
      if (bis <= von) continue;
      ctx.drawImage(atlas, sp.ax, sp.ay + von, sp.w, bis - von, o.x, o.y + von, sp.w, bis - von);
    }
  }

  function zeichne(boden, atlas) {
    const dpr = window.devicePixelRatio || 1;
    const skala = zoom * dpr;
    const vw = canvas.width / skala, vh = canvas.height / skala;

    const mx = spieler.x + SPIELER_GROESSE / 2, my = spieler.y + SPIELER_GROESSE / 2;
    let camX = mx - vw / 2, camY = my - vh / 2;
    camX = vw >= MAP_W ? (MAP_W - vw) / 2 : Math.max(0, Math.min(MAP_W - vw, camX));
    camY = vh >= MAP_H ? (MAP_H - vh) / 2 : Math.max(0, Math.min(MAP_H - vh, camY));
    camX = Math.round(camX * skala) / skala;
    camY = Math.round(camY * skala) / skala;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = false;
    ctx.setTransform(skala, 0, 0, skala, -camX * skala, -camY * skala);

    ctx.drawImage(boden, 0, 0);
    zeichneObjekte(atlas, false, camX, camY, camX + vw, camY + vh);

    // Spieler
    ctx.fillStyle = '#8a8a8a';
    ctx.fillRect(spieler.x, spieler.y, SPIELER_GROESSE, SPIELER_GROESSE);
    ctx.fillStyle = '#5c5c5c';
    ctx.fillRect(spieler.x, spieler.y + SPIELER_GROESSE - 1, SPIELER_GROESSE, 1);
    ctx.fillRect(spieler.x + SPIELER_GROESSE - 1, spieler.y, 1, SPIELER_GROESSE);

    zeichneObjekte(atlas, true, camX, camY, camX + vw, camY + vh);

    // Kollisions-Ansicht (aus dem aktuellen Raster, zeigt also auch Aenderungen)
    const x0 = Math.max(0, Math.floor(camX / TILE)), x1 = Math.min(COLS - 1, Math.floor((camX + vw) / TILE));
    const y0 = Math.max(0, Math.floor(camY / TILE)), y1 = Math.min(ROWS - 1, Math.floor((camY + vh) / TILE));
    if (zeigeKollision || (editor && modusTab === 'kollision')) {
      for (let ty = y0; ty <= y1; ty++)
        for (let tx = x0; tx <= x1; tx++) {
          const f = FARBE[raster[ty][tx]];
          if (f) { ctx.fillStyle = f; ctx.fillRect(tx * TILE, ty * TILE, TILE, TILE); }
        }
    }
    if (editor && modusTab === 'ebenen') {
      const l = 1 / skala;
      ctx.lineWidth = 2 / skala;
      for (const key of ebenenAenderungen.keys()) {
        const o = objektNach.get(key);
        ctx.strokeStyle = o.modus === 'vorne' ? '#ff9f2e' : o.modus === 'hinten' ? '#4fc3ff' : '#ffd23f';
        ctx.strokeRect(o.x + l, o.y + l, o.sp.w - 2 * l, o.sp.h - 2 * l);
      }
      mausObjekt = maus ? objektUnter(maus.mx, maus.my) : null;
      if (mausObjekt) {
        const o = mausObjekt;
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(o.x, o.y, o.sp.w, o.sp.h);
        if (o.modus === 'geteilt' && o.trenn > 0 && o.trenn < o.sp.h) {
          ctx.fillStyle = 'rgba(255,255,255,.8)';
          ctx.fillRect(o.x, o.y + o.trenn, o.sp.w, l);
        }
      }
    }
    if (editor && modusTab === 'kollision') {
      const l = 1 / skala;
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      for (let tx = x0; tx <= x1 + 1; tx++) ctx.fillRect(tx * TILE, y0 * TILE, l, (y1 - y0 + 1) * TILE);
      for (let ty = y0; ty <= y1 + 1; ty++) ctx.fillRect(x0 * TILE, ty * TILE, (x1 - x0 + 1) * TILE, l);
      // geaenderte Kacheln gelb umranden
      ctx.strokeStyle = '#ffd23f';
      ctx.lineWidth = 2 / skala;
      for (const key of aenderungen.keys()) {
        const [tx, ty] = key.split(',').map(Number);
        if (tx >= x0 && tx <= x1 && ty >= y0 && ty <= y1)
          ctx.strokeRect(tx * TILE + l, ty * TILE + l, TILE - 2 * l, TILE - 2 * l);
      }
      if (maus && maus.tx >= 0 && maus.ty >= 0 && maus.tx < COLS && maus.ty < ROWS) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1 / skala * 2;
        ctx.strokeRect(maus.tx * TILE, maus.ty * TILE, TILE, TILE);
      }
    }
    return { camX, camY, skala };
  }

  const NAME = { '1': 'frei', '2': 'gesperrt', '3': 'verdeckt' };
  const MODUS_NAME = { hinten: 'hinter Spieler', geteilt: 'geteilt (Fuß unten, Rest oben)', vorne: 'vor Spieler' };

  // ---- Spielschleife ---------------------------------------------------
  Promise.all([lade('ebene0_untergrund.png'), lade('objekte_atlas.png')])
    .then(([boden, atlas]) => {
      let letzte = performance.now();

      function schritt(jetzt) {
        const dt = Math.min(0.05, (jetzt - letzte) / 1000);
        letzte = jetzt;

        let dx = 0, dy = 0;
        if (tasten.has('l')) dx -= 1;
        if (tasten.has('r')) dx += 1;
        if (tasten.has('o')) dy -= 1;
        if (tasten.has('u')) dy += 1;
        if (touchZiel) {
          const z = bildschirmZuKachel(touchZiel.x, touchZiel.y);
          const ex = z.mx - (spieler.x + SPIELER_GROESSE / 2), ey = z.my - (spieler.y + SPIELER_GROESSE / 2);
          if (Math.abs(ex) > 4) dx = Math.sign(ex);
          if (Math.abs(ey) > 4) dy = Math.sign(ey);
        }
        if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
        bewege(dx * TEMPO * dt, dy * TEMPO * dt);

        kamera = zeichne(boden, atlas);

        const tx = Math.floor((spieler.x + 8) / TILE), ty = Math.floor((spieler.y + 8) / TILE);
        let text = 'Pfeiltasten/WASD laufen · K Kollision · E Editor · +/- Zoom (' + zoom + 'x)\n' +
          'Spieler auf Kachel ' + tx + ', ' + ty;
        if (editor && modusTab === 'kollision') {
          text += '\nKollision: klicken/ziehen malt · 1 frei · 2 gesperrt · 3 verdeckt · Tab Ebenen · Strg+Z';
          if (maus && maus.tx >= 0 && maus.ty >= 0 && maus.tx < COLS && maus.ty < ROWS)
            text += '\nZeiger auf Kachel ' + maus.tx + ', ' + maus.ty + ' (' + NAME[raster[maus.ty][maus.tx]] + ')';
        } else if (editor) {
          text += '\nEbenen: Objekt anklicken · 1 hinter · 2 geteilt · 3 vor Spieler · Tab Kollision · Strg+Z';
          if (mausObjekt) text += '\nObjekt ' + mausObjekt.sp.name + ' (' + MODUS_NAME[mausObjekt.modus] + ')';
        }
        info.textContent = text;

        requestAnimationFrame(schritt);
      }
      requestAnimationFrame(schritt);
    })
    .catch(err => {
      info.textContent = err.message + '\nTipp: Seite aus dem Repo-Ordner öffnen.';
    });
})();
</script>
